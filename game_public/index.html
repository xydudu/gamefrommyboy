<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>征服者 - 策略战争游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .game-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 10px;
            margin-bottom: 20px; border: 2px solid #e94560;
        }
        .gold-display { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: bold; color: #ffd700; }
        .game-title {
            font-size: 28px; font-weight: bold;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .map-view { display: block; }
        .map-container {
            background: linear-gradient(135deg, #3d5c3d 0%, #5a7d5a 50%, #4a6b4a 100%);
            border-radius: 15px; padding: 40px; min-height: 600px; border: 4px solid #8b7355;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }
        .map-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139,115,85,0.3) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(139,115,85,0.3) 0%, transparent 25%);
            pointer-events: none;
        }
        .map-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px;
            position: relative;
            z-index: 1;
        }
        .target-card {
            background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
            border-radius: 8px; padding: 25px; text-align: center; cursor: pointer;
            border: 3px solid #6b6b6b; 
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 2px 10px rgba(255,255,255,0.1);
        }
        .target-card::before {
            content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 80px;
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
            border: 2px solid #8b7355;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .target-card::after {
            content: '🚩'; position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            font-size: 24px;
        }
        .target-card:hover { 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 
                0 20px 50px rgba(233,69,96,0.4),
                inset 0 2px 10px rgba(255,255,255,0.1);
            border-color: #e94560;
        }
        .target-card.difficulty-hard { border-color: #e74c3c; }
        .target-card.difficulty-medium { border-color: #f39c12; }
        .target-card.difficulty-easy { border-color: #27ae60; }
        .target-icon { font-size: 64px; margin-bottom: 15px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .target-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .target-difficulty { display: inline-block; padding: 5px 15px; border-radius: 15px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .difficulty-easy { background: linear-gradient(145deg, #27ae60, #1e8449); color: white; }
        .difficulty-medium { background: linear-gradient(145deg, #f39c12, #d68910); color: white; }
        .difficulty-hard { background: linear-gradient(145deg, #e74c3c, #c0392b); color: white; }
        .target-reward { margin-top: 12px; color: #ffd700; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-size: 14px; }
        .battle-view { display: none; }
        .battle-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .battle-panel { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 25px; border: 2px solid #e94560; }
        .panel-title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e94560; }
        .enemy-info { text-align: center; }
        .enemy-avatar { font-size: 64px; margin-bottom: 15px; }
        .enemy-name { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .enemy-stats { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .stat-box { background: rgba(231,76,60,0.2); padding: 10px 20px; border-radius: 8px; border: 1px solid #e74c3c; }
        .stat-label { font-size: 12px; color: #aaa; }
        .stat-value { font-size: 20px; font-weight: bold; color: #e74c3c; }
        .recruitment-area { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 25px; border: 2px solid #27ae60; margin-bottom: 20px; }
        .recruitment-title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 20px; color: #27ae60; }
        .units-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .unit-card { background: linear-gradient(145deg, #2c3e50, #34495e); border-radius: 12px; padding: 15px; border: 2px solid #3498db; }
        .unit-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .unit-icon { font-size: 36px; }
        .unit-name { font-size: 16px; font-weight: bold; }
        .unit-level { font-size: 12px; color: #f39c12; margin-left: auto; }
        .unit-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; font-size: 13px; }
        .unit-stat { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 5px; }
        .unit-actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-recruit { background: linear-gradient(145deg, #27ae60, #2ecc71); color: white; }
        .btn-recruit:hover { background: linear-gradient(145deg, #2ecc71, #27ae60); }
        .btn-recruit:disabled { background: #555; cursor: not-allowed; }
        .btn-upgrade { background: linear-gradient(145deg, #f39c12, #e67e22); color: white; font-size: 12px; }
        .btn-upgrade:hover { background: linear-gradient(145deg, #e67e22, #f39c12); }
        .btn-upgrade:disabled { background: #555; cursor: not-allowed; }
        .unlock-section { text-align: center; margin-top: 20px; }
        .btn-unlock { background: linear-gradient(145deg, #9b59b6, #8e44ad); color: white; padding: 15px 40px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; }
        .btn-unlock:hover { background: linear-gradient(145deg, #8e44ad, #9b59b6); transform: translateY(-3px); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: linear-gradient(145deg, #2c3e50, #34495e); border-radius: 20px; padding: 30px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; border: 3px solid #9b59b6; }
        .modal-title { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 25px; color: #9b59b6; }
        .unlock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .unlock-card { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 20px; text-align: center; border: 2px solid #555; }
        .unlock-card.unlocked { border-color: #27ae60; background: rgba(39,174,96,0.1); }
        .unlock-card.locked { border-color: #e74c3c; background: rgba(231,76,60,0.1); }
        .unlock-card.can-unlock { border-color: #f39c12; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 10px rgba(243,156,18,0.5); } 50% { box-shadow: 0 0 25px rgba(243,156,18,0.8); } }
        .unlock-icon { font-size: 48px; margin-bottom: 10px; position: relative; }
        .lock-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 32px; color: #e74c3c; }
        .unlock-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .unlock-cost { font-size: 14px; color: #ffd700; margin-bottom: 10px; }
        .unlock-desc { font-size: 12px; color: #aaa; margin-bottom: 12px; }
        .btn-unlock-unit { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-unlock-unit.locked { background: #e74c3c; color: white; }
        .btn-unlock-unit.unlocked { background: #27ae60; color: white; }
        .btn-unlock-unit.can-unlock { background: #f39c12; color: white; }
        .btn-close-modal { display: block; width: 200px; margin: 0 auto; padding: 12px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        /* 战斗结果弹窗 */
        .battle-result-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .battle-result-overlay.active { display: flex; }
        .battle-result-content { background: linear-gradient(145deg, #1a1a2e, #16213e); border-radius: 25px; padding: 40px; max-width: 600px; width: 90%; border: 3px solid; box-shadow: 0 25px 80px rgba(0,0,0,0.8); animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .battle-result-content.victory { border-color: #27ae60; box-shadow: 0 25px 80px rgba(39,174,96,0.3); }
        .battle-result-content.defeat { border-color: #e74c3c; box-shadow: 0 25px 80px rgba(231,76,60,0.3); }
        .result-header { text-align: center; margin-bottom: 25px; }
        .result-icon { font-size: 80px; margin-bottom: 15px; animation: bounce 1s ease infinite; }
        @keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .result-title { font-size: 36px; font-weight: bold; margin-bottom: 10px; }
        .result-title.victory { color: #27ae60; }
        .result-title.defeat { color: #e74c3c; }
        .result-subtitle { font-size: 16px; color: #aaa; }
        .battle-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .battle-stat-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #3498db; }
        .battle-stat-label { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .battle-stat-value { font-size: 28px; font-weight: bold; color: #fff; }
        .battle-stat-value.damage { color: #e74c3c; }
        .battle-stat-value.gold { color: #ffd700; }
        .battle-log { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px; max-height: 200px; overflow-y: auto; margin: 20px 0; border: 1px solid #555; }
        .battle-log-title { font-size: 14px; color: #aaa; margin-bottom: 12px; text-align: center; }
        .log-entry { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .log-entry:last-child { border-bottom: none; }
        .log-entry.player { color: #3498db; }
        .log-entry.enemy { color: #e74c3c; }
        .log-entry.result { color: #f39c12; font-weight: bold; }
        .btn-result { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; margin-top: 20px; }
        .btn-result.victory { background: linear-gradient(145deg, #27ae60, #2ecc71); color: white; }
        .btn-result.victory:hover { background: linear-gradient(145deg, #2ecc71, #27ae60); transform: translateY(-2px); }
        .btn-result.defeat { background: linear-gradient(145deg, #e74c3c, #ff6b6b); color: white; }
        .btn-result.defeat:hover { background: linear-gradient(145deg, #ff6b6b, #e74c3c); transform: translateY(-2px); }
        /* 战斗过程动画界面 */
        .battle-process-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%); z-index: 3000; justify-content: center; align-items: center; }
        .battle-process-overlay.active { display: flex; }
        .battle-process-container { width: 90%; max-width: 900px; padding: 30px; }
        .battle-process-header { text-align: center; margin-bottom: 30px; }
        .battle-process-title { font-size: 32px; font-weight: bold; background: linear-gradient(45deg, #e94560, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .battle-process-subtitle { font-size: 16px; color: #888; }
        .battle-arena { display: flex; justify-content: space-between; align-items: center; margin: 40px 0; position: relative; }
        .battle-arena::before { content: 'VS'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: bold; color: #e94560; text-shadow: 0 0 30px rgba(233,69,96,0.5); animation: vsPulse 1.5s ease infinite; }
        @keyframes vsPulse { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }
        .battle-side { text-align: center; flex: 1; }
        .battle-side.enemy { padding-right: 80px; }
        .battle-side.player { padding-left: 80px; }
        .side-icon { font-size: 80px; margin-bottom: 15px; animation: sideFloat 2s ease infinite; }
        @keyframes sideFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .side-name { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .side-hp-bar { width: 200px; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; margin: 0 auto 10px; overflow: hidden; border: 2px solid #555; }
        .side-hp-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
        .side-hp-fill.enemy { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .side-hp-fill.player { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .side-hp-text { font-size: 14px; color: #aaa; }
        .battle-actions { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 20px; height: 200px; overflow-y: auto; border: 2px solid #3498db; margin-bottom: 20px; }
        .battle-actions-title { text-align: center; font-size: 16px; color: #3498db; margin-bottom: 15px; font-weight: bold; }
        .action-entry { display: flex; align-items: center; padding: 10px; margin-bottom: 8px; border-radius: 8px; animation: actionSlide 0.3s ease; }
        @keyframes actionSlide { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .action-entry.player { background: rgba(52,152,219,0.2); border-left: 4px solid #3498db; }
        .action-entry.enemy { background: rgba(231,76,60,0.2); border-left: 4px solid #e74c3c; }
        .action-entry.critical { background: rgba(243,156,18,0.3); border-left: 4px solid #f39c12; animation: criticalShake 0.5s ease; }
        @keyframes criticalShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .action-icon { font-size: 24px; margin-right: 15px; }
        .action-text { flex: 1; font-size: 15px; }
        .action-damage { font-size: 20px; font-weight: bold; }
        .action-damage.player { color: #3498db; }
        .action-damage.enemy { color: #e74c3c; }
        .action-damage.critical { color: #f39c12; font-size: 24px; text-shadow: 0 0 10px rgba(243,156,18,0.5); }
        .battle-skip-btn { display: block; width: 200px; margin: 0 auto; padding: 12px; background: rgba(255,255,255,0.1); color: #aaa; border: 2px solid #555; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.3s ease; }
        .battle-skip-btn:hover { background: rgba(255,255,255,0.2); color: #fff; border-color: #888; }
        /* 伤害数字动画 */
        .damage-popup { position: absolute; font-size: 36px; font-weight: bold; animation: damageFloat 1s ease forwards; pointer-events: none; }
        @keyframes damageFloat { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }
        .damage-popup.player { color: #3498db; text-shadow: 0 0 20px rgba(52,152,219,0.8); }
        .damage-popup.enemy { color: #e74c3c; text-shadow: 0 0 20px rgba(231,76,60,0.8); }
        .damage-popup.critical { color: #f39c12; font-size: 48px; text-shadow: 0 0 30px rgba(243,156,18,1); }
        .action-bar { display: flex; justify-content: space-between; gap: 15px; }
        .btn-back { background: linear-gradient(145deg, #7f8c8d, #95a5a6); color: white; padding: 15px 30px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
        .btn-battle { background: linear-gradient(145deg, #e94560, #ff6b6b); color: white; padding: 15px 50px; font-size: 20px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
        .recruited-units { margin-top: 15px; padding-top: 15px; border-top: 1px solid #555; }
        .recruited-title { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .recruited-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .recruited-item { background: rgba(39,174,96,0.3); padding: 5px 12px; border-radius: 15px; font-size: 13px; border: 1px solid #27ae60; }
        @media (max-width: 768px) {
            .map-grid { grid-template-columns: repeat(2, 1fr); }
            .battle-container { grid-template-columns: 1fr; }
            .unlock-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top-bar">
            <div class="game-title">⚔️ 征服者</div>
            <div class="gold-display"><span>💰</span><span id="goldAmount">500</span> <span style="color:#fff;font-size:18px;margin-left:20px;">👥 <span id="population">0</span>/<span id="maxPopulation">5</span> <button onclick="upgradePopulation()" style="margin-left:10px;padding:5px 10px;background:#f39c12;border:none;border-radius:5px;color:white;cursor:pointer;font-size:14px;">💰+1 人口 (100 金)</button></span></div>
        </div>

        <div class="map-view" id="mapView">
            <div class="map-container">
                <div class="map-grid" id="mapGrid"></div>
            </div>
        </div>

        <div class="battle-view" id="battleView">
            <div class="battle-container">
                <div class="battle-panel">
                    <div class="panel-title">🏴 敌方势力</div>
                    <div class="enemy-info">
                        <div class="enemy-avatar" id="enemyAvatar">🏰</div>
                        <div class="enemy-name" id="enemyName">黑暗城堡</div>
                        <div class="enemy-stats">
                            <div class="stat-box"><div class="stat-label">攻击力</div><div class="stat-value" id="enemyAttack">150</div></div>
                            <div class="stat-box"><div class="stat-label">防御力</div><div class="stat-value" id="enemyDefense">100</div></div>
                        </div>
                    </div>
                </div>
                <div class="battle-panel">
                    <div class="panel-title">🛡️ 我方势力</div>
                    <div class="enemy-info">
                        <div class="enemy-avatar">👑</div>
                        <div class="enemy-name">皇家军团</div>
                        <div class="enemy-stats">
                            <div class="stat-box" style="background:rgba(39,174,96,0.2);border-color:#27ae60;"><div class="stat-label">总攻击力</div><div class="stat-value" style="color:#27ae60;" id="totalAttack">0</div></div>
                            <div class="stat-box" style="background:rgba(39,174,96,0.2);border-color:#27ae60;"><div class="stat-label">总防御力</div><div class="stat-value" style="color:#27ae60;" id="totalDefense">0</div></div>
                        </div>
                    </div>
                    <div class="recruited-units">
                        <div class="recruited-title">已招募兵种:</div>
                        <div class="recruited-list" id="recruitedList"><span style="color:#666;">暂无</span></div>
                    </div>
                </div>
            </div>

            <div class="recruitment-area">
                <div class="recruitment-title">⚔️ 兵种招募与升级</div>
                <div class="units-grid" id="unitsGrid"></div>
            </div>

            <div class="unlock-section">
                <button class="btn-unlock" onclick="showUnlockModal()">🔓 解锁新兵种</button>
            </div>

            <div class="action-bar">
                <button class="btn-back" onclick="backToMap()">← 返回地图</button>
                <button class="btn-battle" onclick="startBattle()">⚔️ 开始战斗</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="unlockModal">
        <div class="modal-content">
            <div class="modal-title">🔓 兵种解锁</div>
            <div class="unlock-grid" id="unlockGrid"></div>
            <button class="btn-close-modal" onclick="closeUnlockModal()">关闭</button>
        </div>
    </div>

    <!-- 战斗结果弹窗 -->
    <div class="battle-result-overlay" id="battleResultModal">
        <div class="battle-result-content" id="battleResultContent">
            <div class="result-header">
                <div class="result-icon" id="resultIcon">🏆</div>
                <div class="result-title" id="resultTitle">胜利！</div>
                <div class="result-subtitle" id="resultSubtitle">敌军已被击溃</div>
            </div>
            <div class="battle-stats" id="battleStats">
                <!-- 动态生成 -->
            </div>
            <div class="battle-log">
                <div class="battle-log-title">📜 战斗记录</div>
                <div id="battleLogContent">
                    <!-- 动态生成 -->
                </div>
            </div>
            <button class="btn-result" id="resultButton" onclick="closeBattleResult()">继续征战</button>
        </div>
    </div>

    <!-- 战斗过程动画界面 -->
    <div class="battle-process-overlay" id="battleProcessModal">
        <div class="battle-process-container">
            <div class="battle-process-header">
                <div class="battle-process-title">⚔️ 战斗进行中</div>
                <div class="battle-process-subtitle" id="processSubtitle">第 1 回合</div>
            </div>
            
            <div class="battle-arena">
                <div class="battle-side enemy">
                    <div class="side-icon" id="enemySideIcon">🏰</div>
                    <div class="side-name" id="enemySideName">黑暗城堡</div>
                    <div class="side-hp-bar">
                        <div class="side-hp-fill enemy" id="enemyHpBar" style="width: 100%"></div>
                    </div>
                    <div class="side-hp-text" id="enemyHpText">1000 / 1000</div>
                </div>
                
                <div class="battle-side player">
                    <div class="side-icon">👑</div>
                    <div class="side-name">皇家军团</div>
                    <div class="side-hp-bar">
                        <div class="side-hp-fill player" id="playerHpBar" style="width: 100%"></div>
                    </div>
                    <div class="side-hp-text" id="playerHpText">500 / 500</div>
                </div>
            </div>
            
            <div class="battle-actions" id="battleActions">
                <div class="battle-actions-title">📜 战斗日志</div>
                <!-- 动态生成战斗动作 -->
            </div>
            
            <button class="battle-skip-btn" onclick="skipBattleProcess()">⏩ 跳过战斗</button>
        </div>
    </div>

    <script>
        const gameData = {
            gold: 500,
            maxPopulation: 5,
            currentTarget: null,
            recruitedUnits: [],
            targets: [
                { id: 1, name: '边境哨站', icon: '🏚️', difficulty: 'hard', attack: 500, attackRange: 100, defense: 400, reward: 300 },
                { id: 2, name: '强盗营地', icon: '⛺', difficulty: 'hard', attack: 280, attackRange: 150, defense: 250, reward: 500 },
                { id: 3, name: '废弃城堡', icon: '🏰', difficulty: 'hard', attack: 320, attackRange: 200, defense: 280, reward: 700 },
                { id: 4, name: '兽人部落', icon: '🏕️', difficulty: 'hard', attack: 350, attackRange: 250, defense: 300, reward: 1000 },
                { id: 5, name: '黑暗要塞', icon: '🗿', difficulty: 'hard', attack: 400, attackRange: 300, defense: 350, reward: 1300 },
                { id: 6, name: '龙之巢穴', icon: '🐉', difficulty: 'hard', attack: 500, attackRange: 350, defense: 400, reward: 1600 },
                { id: 7, name: '恶魔王座', icon: '👹', difficulty: 'hard', attack: 600, attackRange: 400, defense: 500, reward: 1900 },
                { id: 8, name: '虚空神殿', icon: '🔮', difficulty: 'hard', attack: 700, attackRange: 450, defense: 600, reward: 2200 }
            ],
            units: [
                { id: 'infantry', name: '步兵', icon: '⚔️', unlocked: true, unlockCost: 0, baseCost: 50, baseAttack: 20, baseHp: 100, desc: '基础近战单位，攻守平衡' },
                { id: 'archer', name: '弓箭手', icon: '🏹', unlocked: false, unlockCost: 200, baseCost: 80, baseAttack: 35, baseHp: 60, desc: '远程攻击单位，高攻低防' },
                { id: 'shieldman', name: '盾兵', icon: '🛡️', unlocked: false, unlockCost: 400, baseCost: 120, baseAttack: 15, baseHp: 150, desc: '防御型单位，极高血量', requires: 'archer' },
                { id: 'pikeman', name: '长矛兵', icon: '🔱', unlocked: false, unlockCost: 300, baseCost: 100, baseAttack: 25, baseHp: 120, desc: '重装防御单位，高血量', requires: 'shieldman' },
                { id: 'cavalry', name: '骑兵', icon: '🐴', unlocked: false, unlockCost: 500, baseCost: 150, baseAttack: 45, baseHp: 90, desc: '高速突击单位，高攻击', requires: 'pikeman' },
                { id: 'tank', name: '坦克', icon: '⚙️', unlocked: false, unlockCost: 600, baseCost: 200, baseAttack: 60, baseHp: 200, desc: '终极战争机器，攻守兼备', requires: 'cavalry' }
            ],
            unitLevels: {}
        };

        function initUnitLevels() {
            gameData.units.forEach(unit => {
                if (!gameData.unitLevels[unit.id]) {
                    gameData.unitLevels[unit.id] = { level: 1, upgradeCost: Math.floor(unit.baseCost * 0.8) };
                }
            });
        }

        function getUnitStats(unitId) {
            const unit = gameData.units.find(u => u.id === unitId);
            const levelData = gameData.unitLevels[unitId];
            const multiplier = 1 + (levelData.level - 1) * 0.2;
            return { attack: Math.floor(unit.baseAttack * multiplier), hp: Math.floor(unit.baseHp * multiplier), cost: unit.baseCost };
        }

        function updateGold() { document.getElementById('goldAmount').textContent = gameData.gold; }
        function updatePopulation() { document.getElementById('population').textContent = gameData.recruitedUnits.length; document.getElementById('maxPopulation').textContent = gameData.maxPopulation; }

        function renderMap() {
            document.getElementById('mapGrid').innerHTML = gameData.targets.map(t => `
                <div class="target-card" onclick="selectTarget(${t.id})">
                    <div class="target-icon">${t.icon}</div>
                    <div class="target-name">${t.name}</div>
                    <span class="target-difficulty difficulty-${t.difficulty}">${t.difficulty === 'easy' ? '简单' : t.difficulty === 'medium' ? '中等' : '困难'}</span>
                    <div class="target-reward">💰 ${t.reward}</div>
                </div>
            `).join('');
        }

        function selectTarget(targetId) {
            gameData.currentTarget = gameData.targets.find(t => t.id === targetId);
            gameData.recruitedUnits = [];
            document.getElementById('enemyAvatar').textContent = gameData.currentTarget.icon;
            document.getElementById('enemyName').textContent = gameData.currentTarget.name;
            // 显示攻击力范围
            const minAttack = Math.max(1, gameData.currentTarget.attack - gameData.currentTarget.attackRange);
            const maxAttack = gameData.currentTarget.attack + gameData.currentTarget.attackRange;
            document.getElementById('enemyAttack').textContent = `${minAttack}-${maxAttack}`;
            document.getElementById('enemyDefense').textContent = gameData.currentTarget.defense;
            updatePlayerStats();
            renderUnits();
            document.getElementById('mapView').style.display = 'none';
            document.getElementById('battleView').style.display = 'block';
        }

        function backToMap() {
            document.getElementById('battleView').style.display = 'none';
            document.getElementById('mapView').style.display = 'block';
            gameData.currentTarget = null;
            gameData.recruitedUnits = [];
            updatePopulation();
        }

        function renderUnits() {
            document.getElementById('unitsGrid').innerHTML = gameData.units.filter(u => u.unlocked).map(unit => {
                const stats = getUnitStats(unit.id);
                const levelData = gameData.unitLevels[unit.id];
                return `
                    <div class="unit-card">
                        <div class="unit-header"><span class="unit-icon">${unit.icon}</span><span class="unit-name">${unit.name}</span><span class="unit-level">Lv.${levelData.level}</span></div>
                        <div class="unit-stats">
                            <div class="unit-stat"><span>⚔️ 攻击</span><span>${stats.attack}</span></div>
                            <div class="unit-stat"><span>❤️ 血量</span><span>${stats.hp}</span></div>
                            <div class="unit-stat"><span>💰 招募</span><span>${stats.cost}</span></div>
                            <div class="unit-stat"><span>⬆️ 升级</span><span>${levelData.upgradeCost}</span></div>
                        </div>
                        <div class="unit-actions">
                            <button class="btn btn-recruit" onclick="recruitUnit('${unit.id}')" ${gameData.gold < stats.cost ? 'disabled' : ''}>招募</button>
                            <button class="btn btn-upgrade" onclick="upgradeUnit('${unit.id}')" ${gameData.gold < levelData.upgradeCost ? 'disabled' : ''}>升级</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function recruitUnit(unitId) {
            if (gameData.recruitedUnits.length >= gameData.maxPopulation) { alert(`⚠️ 人口已达上限！当前上限 ${gameData.maxPopulation}，可升级人口上限或返回减少兵力。`); return; }
            const unit = gameData.units.find(u => u.id === unitId);
            const stats = getUnitStats(unitId);
            if (gameData.gold >= stats.cost) {
                gameData.gold -= stats.cost;
                gameData.recruitedUnits.push({ id: unitId, name: unit.name, icon: unit.icon, attack: stats.attack, hp: stats.hp });
                updateGold();
                updatePopulation();
                updatePlayerStats();
                renderUnits();
                updateRecruitedList();
            }
        }

        function upgradePopulation() {
            const upgradeCost = 100;
            if (gameData.gold >= upgradeCost) {
                gameData.gold -= upgradeCost;
                gameData.maxPopulation += 1;
                updateGold();
                updatePopulation();
                alert(`✅ 人口上限 +1！当前上限：${gameData.maxPopulation}`);
            } else {
                alert(`⚠️ 金币不足！升级人口上限需要 ${upgradeCost} 金币。`);
            }
        }

        function upgradeUnit(unitId) {
            const levelData = gameData.unitLevels[unitId];
            if (gameData.gold >= levelData.upgradeCost) {
                gameData.gold -= levelData.upgradeCost;
                levelData.level++;
                levelData.upgradeCost = Math.floor(levelData.upgradeCost * 1.5);
                updateGold();
                renderUnits();
                updatePlayerStats();
                gameData.recruitedUnits.forEach(u => { if (u.id === unitId) { const s = getUnitStats(unitId); u.attack = s.attack; u.hp = s.hp; } });
                updateRecruitedList();
            }
        }

        function updatePlayerStats() {
            const totalAttack = gameData.recruitedUnits.reduce((sum, u) => sum + u.attack, 0);
            const totalDefense = gameData.recruitedUnits.reduce((sum, u) => sum + u.hp, 0);
            document.getElementById('totalAttack').textContent = totalAttack;
            document.getElementById('totalDefense').textContent = totalDefense;
        }

        function updateRecruitedList() {
            const list = document.getElementById('recruitedList');
            if (gameData.recruitedUnits.length === 0) { list.innerHTML = '<span style="color:#666;">暂无</span>'; return; }
            const counts = {};
            gameData.recruitedUnits.forEach(u => { counts[u.name] = (counts[u.name] || 0) + 1; });
            list.innerHTML = Object.entries(counts).map(([name, count]) => `<span class="recruited-item">${name} x${count}</span>`).join('');
        }

        function showUnlockModal() {
            document.getElementById('unlockGrid').innerHTML = gameData.units.map(unit => {
                const prerequisiteUnlocked = !unit.requires || gameData.units.find(u => u.id === unit.requires)?.unlocked;
                const canUnlock = !unit.unlocked && prerequisiteUnlocked && gameData.gold >= unit.unlockCost;
                const lockedByPrereq = !unit.unlocked && !prerequisiteUnlocked;
                
                let statusText = unit.unlocked ? '✅ 已解锁' : `💰 ${unit.unlockCost}`;
                let buttonText = canUnlock ? '解锁' : (lockedByPrereq ? '需先解锁前置兵种' : '金币不足');
                let buttonClass = canUnlock ? 'can-unlock' : 'locked';
                let buttonDisabled = !canUnlock ? 'disabled' : '';
                
                if (lockedByPrereq) {
                    const prereqUnit = gameData.units.find(u => u.id === unit.requires);
                    statusText = `🔒 需先解锁 ${prereqUnit?.name || '前置兵种'}`;
                }
                
                return `
                    <div class="unlock-card ${unit.unlocked ? 'unlocked' : canUnlock ? 'can-unlock' : 'locked'}">
                        <div class="unlock-icon">${unit.icon}${!unit.unlocked ? '<span class="lock-overlay">🔒</span>' : ''}</div>
                        <div class="unlock-name">${unit.name}</div>
                        <div class="unlock-cost">${statusText}</div>
                        <div class="unlock-desc">${unit.desc}</div>
                        ${!unit.unlocked ? `<button class="btn-unlock-unit ${buttonClass}" onclick="unlockUnit('${unit.id}')" ${buttonDisabled}>${buttonText}</button>` : '<button class="btn-unlock-unit unlocked" disabled>已拥有</button>'}
                    </div>
                `;
            }).join('');
            document.getElementById('unlockModal').classList.add('active');
        }

        function closeUnlockModal() { document.getElementById('unlockModal').classList.remove('active'); }

        function unlockUnit(unitId) {
            const unit = gameData.units.find(u => u.id === unitId);
            const prerequisiteUnlocked = !unit.requires || gameData.units.find(u => u.id === unit.requires)?.unlocked;
            
            if (!unit.unlocked && prerequisiteUnlocked && gameData.gold >= unit.unlockCost) {
                gameData.gold -= unit.unlockCost;
                unit.unlocked = true;
                updateGold();
                renderUnits();
                showUnlockModal();
            } else if (!prerequisiteUnlocked) {
                const prereqUnit = gameData.units.find(u => u.id === unit.requires);
                alert(`⚠️ 需要先解锁 ${prereqUnit?.name || '前置兵种'} 才能解锁 ${unit.name}！`);
            }
        }

        function startBattle() {
            if (gameData.recruitedUnits.length === 0) { 
                showBattleResult({
                    victory: false,
                    title: '无法出战',
                    subtitle: '请先招募至少一个兵种',
                    icon: '⚠️',
                    logs: ['您的军团还没有士兵！'],
                    stats: []
                });
                return; 
            }
            
            // 显示战斗过程界面
            showBattleProcess();
        }

        let battleProcessData = null;
        let currentRound = 0;
        let battleInterval = null;

        function showBattleProcess() {
            const totalAttack = gameData.recruitedUnits.reduce((sum, u) => sum + u.attack, 0);
            const totalDefense = gameData.recruitedUnits.reduce((sum, u) => sum + u.hp, 0);
            // 随机攻击力：基础攻击 ± 随机范围
            const enemyRandomOffset = Math.floor(Math.random() * gameData.currentTarget.attackRange * 2) - gameData.currentTarget.attackRange;
            const enemyAttack = Math.max(1, gameData.currentTarget.attack + enemyRandomOffset);
            // 随机防御力：基础防御 ±15%
            const enemyDefenseRandomFactor = 0.85 + Math.random() * 0.3; // 0.85 ~ 1.15
            const enemyDefense = Math.max(1, Math.floor(gameData.currentTarget.defense * enemyDefenseRandomFactor));
            // 我方攻击力随机波动（±10%）
            const playerRandomFactor = 0.9 + Math.random() * 0.2; // 0.9 ~ 1.1
            const playerAttack = Math.max(1, Math.floor(totalAttack * playerRandomFactor));
            // 我方防御力随机波动（±10%）
            const playerDefenseRandomFactor = 0.9 + Math.random() * 0.2; // 0.9 ~ 1.1
            const playerDefense = Math.max(1, Math.floor(totalDefense * playerDefenseRandomFactor));
            
            battleProcessData = {
                playerMaxHp: playerDefense,
                playerHp: playerDefense,
                playerAttack: playerAttack,
                enemyMaxHp: enemyDefense,
                enemyHp: enemyDefense,
                enemyAttack: enemyAttack,
                enemyName: gameData.currentTarget.name,
                enemyIcon: gameData.currentTarget.icon,
                logs: [],
                round: 1,
                isFinished: false
            };
            
            // 初始化界面
            document.getElementById('enemySideIcon').textContent = battleProcessData.enemyIcon;
            document.getElementById('enemySideName').textContent = battleProcessData.enemyName;
            document.getElementById('enemyHpText').textContent = `${battleProcessData.enemyHp} / ${battleProcessData.enemyMaxHp}`;
            document.getElementById('playerHpText').textContent = `${battleProcessData.playerHp} / ${battleProcessData.playerMaxHp}`;
            document.getElementById('enemyHpBar').style.width = '100%';
            document.getElementById('playerHpBar').style.width = '100%';
            document.getElementById('battleActions').innerHTML = '<div class="battle-actions-title">📜 战斗日志</div>';
            document.getElementById('processSubtitle').textContent = '第 1 回合';
            
            document.getElementById('battleProcessModal').classList.add('active');
            
            // 开始战斗动画
            currentRound = 1;
            battleInterval = setInterval(() => processBattleRound(), 800);
        }

        function processBattleRound() {
            if (!battleProcessData || battleProcessData.isFinished) return;
            
            const data = battleProcessData;
            const actionsContainer = document.getElementById('battleActions');
            
            // 我方攻击
            const playerDamage = Math.min(data.playerAttack, data.enemyHp);
            const isPlayerCrit = Math.random() > 0.8; // 20%暴击
            const actualPlayerDamage = isPlayerCrit ? Math.floor(playerDamage * 1.5) : playerDamage;
            
            data.enemyHp = Math.max(0, data.enemyHp - actualPlayerDamage);
            
            // 添加我方攻击日志
            const playerAction = document.createElement('div');
            playerAction.className = `action-entry player ${isPlayerCrit ? 'critical' : ''}`;
            playerAction.innerHTML = `
                <span class="action-icon">⚔️</span>
                <span class="action-text">我方发动${isPlayerCrit ? '暴击' : '攻击'}！</span>
                <span class="action-damage player ${isPlayerCrit ? 'critical' : ''}">-${actualPlayerDamage}</span>
            `;
            actionsContainer.appendChild(playerAction);
            actionsContainer.scrollTop = actionsContainer.scrollHeight;
            
            // 更新敌方血条
            updateHpBar('enemy', data.enemyHp, data.enemyMaxHp);
            
            if (data.enemyHp <= 0) {
                finishBattleProcess(true);
                return;
            }
            
            // 敌方攻击（延迟一点）
            setTimeout(() => {
                if (data.isFinished) return;
                
                const enemyDamage = Math.min(data.enemyAttack, data.playerHp);
                const isEnemyCrit = Math.random() > 0.85; // 15%暴击
                const actualEnemyDamage = isEnemyCrit ? Math.floor(enemyDamage * 1.5) : enemyDamage;
                
                data.playerHp = Math.max(0, data.playerHp - actualEnemyDamage);
                
                // 添加敌方攻击日志
                const enemyAction = document.createElement('div');
                enemyAction.className = `action-entry enemy ${isEnemyCrit ? 'critical' : ''}`;
                enemyAction.innerHTML = `
                    <span class="action-icon">💥</span>
                    <span class="action-text">敌方发动${isEnemyCrit ? '暴击' : '攻击'}！</span>
                    <span class="action-damage enemy ${isEnemyCrit ? 'critical' : ''}">-${actualEnemyDamage}</span>
                `;
                actionsContainer.appendChild(enemyAction);
                actionsContainer.scrollTop = actionsContainer.scrollHeight;
                
                // 更新我方血条
                updateHpBar('player', data.playerHp, data.playerMaxHp);
                
                if (data.playerHp <= 0) {
                    finishBattleProcess(false);
                    return;
                }
                
                // 下一回合
                data.round++;
                document.getElementById('processSubtitle').textContent = `第 ${data.round} 回合`;
                
                if (data.round > 50) {
                    // 超过50回合，按血量比例判定
                    finishBattleProcess(data.playerHp > data.enemyHp);
                }
            }, 400);
        }

        function updateHpBar(side, current, max) {
            const percentage = (current / max) * 100;
            document.getElementById(`${side}HpBar`).style.width = `${percentage}%`;
            document.getElementById(`${side}HpText`).textContent = `${current} / ${max}`;
        }

        function finishBattleProcess(isVictory) {
            if (battleProcessData.isFinished) return;
            battleProcessData.isFinished = true;
            
            if (battleInterval) {
                clearInterval(battleInterval);
                battleInterval = null;
            }
            
            const data = battleProcessData;
            
            // 延迟一下显示结果
            setTimeout(() => {
                document.getElementById('battleProcessModal').classList.remove('active');
                
                // 计算统计数据
                const damageDealt = data.playerAttack * (data.round - (data.enemyHp > 0 ? 0 : 1));
                const damageTaken = data.enemyAttack * (data.round - 1);
                
                if (isVictory) {
                    gameData.gold += gameData.currentTarget.reward;
                }
                
                // 收集所有日志
                const logs = [];
                logs.push({ type: 'result', text: `⚔️ 战斗开始！我方 ${gameData.recruitedUnits.length} 个单位 vs ${data.enemyName}` });
                
                const actionEntries = document.querySelectorAll('.action-entry');
                actionEntries.forEach(entry => {
                    const text = entry.querySelector('.action-text')?.textContent || '';
                    const damage = entry.querySelector('.action-damage')?.textContent || '';
                    let type = 'player';
                    if (entry.classList.contains('enemy')) type = 'enemy';
                    if (entry.classList.contains('critical')) type = 'result';
                    logs.push({ type, text: `${text} ${damage}` });
                });
                
                if (isVictory) {
                    logs.push({ type: 'result', text: `🎉 胜利！获得 💰 ${gameData.currentTarget.reward}` });
                } else {
                    logs.push({ type: 'result', text: '💀 失败！军团全军覆没' });
                }
                
                showBattleResult({
                    victory: isVictory,
                    title: isVictory ? '胜利！' : '失败！',
                    subtitle: isVictory ? `${data.enemyName} 已被征服` : '您的军团需要更强大的力量',
                    icon: isVictory ? '🏆' : '💀',
                    logs: logs,
                    stats: [
                        { label: '造成伤害', value: damageDealt, type: 'damage' },
                        { label: '受到伤害', value: damageTaken, type: 'damage' },
                        { label: '战斗回合', value: data.round, type: 'normal' },
                        { label: isVictory ? '获得金币' : '损失兵力', value: isVictory ? `+${gameData.currentTarget.reward}` : gameData.recruitedUnits.length, type: isVictory ? 'gold' : 'damage' }
                    ]
                });
                
                updateGold();
                gameData.recruitedUnits = [];
                updatePopulation();
                updatePlayerStats();
                updateRecruitedList();
                renderUnits();
            }, 1000);
        }

        function skipBattleProcess() {
            if (battleInterval) {
                clearInterval(battleInterval);
                battleInterval = null;
            }
            
            // 快速计算战斗结果
            const data = battleProcessData;
            const totalAttack = data.playerAttack;
            const totalDefense = data.playerMaxHp;
            const enemyAttack = data.enemyAttack;
            const enemyDefense = data.enemyMaxHp;
            
            let playerHp = totalDefense, enemyHp = enemyDefense;
            let round = 0;
            
            while (playerHp > 0 && enemyHp > 0 && round < 50) {
                enemyHp -= totalAttack;
                if (enemyHp <= 0) break;
                playerHp -= enemyAttack;
                round++;
            }
            
            const isVictory = playerHp > 0;
            data.round = round || 1;
            data.playerHp = Math.max(0, playerHp);
            data.enemyHp = Math.max(0, enemyHp);
            
            finishBattleProcess(isVictory);
        }

        function showBattleResult(data) {
            const modal = document.getElementById('battleResultModal');
            const content = document.getElementById('battleResultContent');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const subtitle = document.getElementById('resultSubtitle');
            const statsContainer = document.getElementById('battleStats');
            const logContainer = document.getElementById('battleLogContent');
            const button = document.getElementById('resultButton');
            
            // 设置样式
            content.className = `battle-result-content ${data.victory ? 'victory' : 'defeat'}`;
            title.className = `result-title ${data.victory ? 'victory' : 'defeat'}`;
            button.className = `btn-result ${data.victory ? 'victory' : 'defeat'}`;
            
            // 设置内容
            icon.textContent = data.icon;
            title.textContent = data.title;
            subtitle.textContent = data.subtitle;
            button.textContent = data.victory ? '继续征战' : '重整旗鼓';
            
            // 生成统计
            statsContainer.innerHTML = data.stats.map(stat => `
                <div class="battle-stat-box">
                    <div class="battle-stat-label">${stat.label}</div>
                    <div class="battle-stat-value ${stat.type}">${stat.value}</div>
                </div>
            `).join('');
            
            // 生成日志
            logContainer.innerHTML = data.logs.map(log => `
                <div class="log-entry ${log.type}">
                    <span>${log.text}</span>
                    ${log.detail ? `<span style="color:#888;margin-left:auto;">${log.detail}</span>` : ''}
                </div>
            `).join('');
            
            modal.classList.add('active');
        }

        function closeBattleResult() {
            document.getElementById('battleResultModal').classList.remove('active');
        }

        initUnitLevels();
        renderMap();
        updatePopulation();
    </script>
</body>
</html>
