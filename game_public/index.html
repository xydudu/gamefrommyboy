<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>征服者 - 策略战争游戏</title>
    <style>
        /* ========== 设计令牌 ========== */
        :root {
            /* 霓虹配色 */
            --neon-red: #ff2d55;
            --neon-pink: #ff6b9d;
            --neon-purple: #c44cff;
            --neon-blue: #00d4ff;
            --neon-cyan: #00ffcc;
            --neon-green: #00ff88;
            --neon-yellow: #ffcc00;
            --neon-orange: #ff8800;
            
            /* 深色背景 */
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 35, 0.6);
            --bg-glass: rgba(30, 30, 50, 0.4);
            
            /* 玻璃态效果 */
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            
            /* 间距 */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            
            /* 圆角 */
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: 
                radial-gradient(ellipse at top, #1a1a2e 0%, transparent 50%),
                radial-gradient(ellipse at bottom, #0f3460 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: #fff;
        }
        
        /* 动态背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 45, 85, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(196, 76, 255, 0.05) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* 主容器 */
        .app-container {
            position: relative;
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 100%;
            height: 100%;
            padding: var(--space-lg);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            gap: var(--space-lg);
            z-index: 1;
        }
        
        /* HUD 头部 */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md) var(--space-lg);
            box-shadow: var(--glass-shadow);
        }
        
        .game-logo {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        
        .logo-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 10px var(--neon-red));
            animation: logoGlow 2s ease-in-out infinite;
        }
        
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 10px var(--neon-red)); }
            50% { filter: drop-shadow(0 0 20px var(--neon-pink)); }
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-red), var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .resource-bar {
            display: flex;
            gap: var(--space-lg);
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            background: rgba(0, 0, 0, 0.3);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
        }
        
        .resource-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--neon-yellow);
        }
        
        /* 难度信息 */
        .difficulty-badge {
            background: linear-gradient(135deg, var(--neon-red), var(--neon-pink));
            padding: var(--space-xs) var(--space-md);
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 45, 85, 0.5);
        }
        
        /* 主游戏区 */
        .game-area {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            overflow: hidden;
        }
        
        /* 地图区域 */
        .map-section {
            flex: 1;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: var(--space-lg);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--neon-cyan);
        }
        
        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--space-md);
            height: calc(100% - 40px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .target-card {
            position: relative;
            background: linear-gradient(145deg, rgba(40, 40, 60, 0.8), rgba(20, 20, 35, 0.9));
            border-radius: var(--radius-md);
            padding: var(--space-lg);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .target-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: var(--neon-red);
            box-shadow: 0 20px 60px rgba(255, 45, 85, 0.3);
        }
        
        .target-emoji {
            font-size: 48px;
        }
        
        .target-name {
            font-size: 14px;
            font-weight: bold;
        }
        
        .target-difficulty {
            display: flex;
            gap: 2px;
        }
        
        .star {
            font-size: 12px;
            color: var(--neon-yellow);
        }
        
        .target-reward {
            font-size: 12px;
            color: var(--neon-green);
        }
        
        /* 底部操作台 */
        .action-dock {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        
        .units-carousel {
            display: flex;
            gap: var(--space-md);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: var(--space-sm);
        }
        
        .unit-mini-card {
            flex-shrink: 0;
            background: linear-gradient(145deg, rgba(40, 40, 60, 0.8), rgba(20, 20, 35, 0.9));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            min-width: 120px;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }
        
        .unit-mini-stats {
            display: flex;
            gap: var(--space-sm);
            font-size: 10px;
            color: var(--neon-cyan);
        }
        
        .action-buttons {
            display: flex;
            gap: var(--space-md);
        }
        
        .btn {
            flex: 1;
            padding: var(--space-md) var(--space-lg);
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-red), var(--neon-pink));
            color: white;
            box-shadow: 0 4px 20px rgba(255, 45, 85, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 45, 85, 0.6);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 战斗面板 */
        .battle-view {
            display: none;
            flex-direction: column;
            gap: var(--space-lg);
            height: 100%;
        }
        
        .battle-view.active {
            display: flex;
        }
        
        .battle-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
        }
        
        .battle-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            text-align: center;
        }
        
        .battle-avatar {
            font-size: 64px;
            margin-bottom: var(--space-md);
        }
        
        .battle-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            margin-top: var(--space-md);
        }
        
        .battle-stat {
            background: rgba(0, 0, 0, 0.3);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
        }
        
        .battle-stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .battle-stat-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--neon-red);
        }
        
        .battle-stat-value.player {
            color: var(--neon-green);
        }
        
        /* 弹窗 */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .modal-backdrop.active {
            display: flex;
        }
        
        .modal-panel {
            background: linear-gradient(145deg, rgba(30, 30, 50, 0.95), rgba(20, 20, 35, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: var(--space-lg);
        }
        
        .unlock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }
        
        .unlock-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            text-align: center;
            border: 2px solid var(--glass-border);
        }
        
        .unlock-card.can-unlock {
            border-color: var(--neon-yellow);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 204, 0, 0.8); }
        }
        
        /* 战斗结果 */
        .battle-result {
            text-align: center;
            padding: var(--space-xl);
        }
        
        .result-icon {
            font-size: 80px;
            margin-bottom: var(--space-lg);
        }
        
        .result-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: var(--space-md);
        }
        
        .result-title.victory {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .result-title.defeat {
            background: linear-gradient(135deg, var(--neon-red), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .app-container {
                padding: var(--space-md);
            }
            
            .map-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
            
            .battle-panels {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 600px) {
            .hud-header {
                flex-direction: column;
                gap: var(--space-md);
            }
            
            .map-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HUD 头部 -->
        <header class="hud-header">
            <div class="game-logo">
                <span class="logo-icon">⚔️</span>
                <span class="logo-text">征服者</span>
            </div>
            <div class="resource-bar">
                <div class="resource-item">
                    <span class="resource-icon">💰</span>
                    <span class="resource-value" id="goldAmount">1000</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">🏆</span>
                    <span class="resource-value" id="victoryCount">0</span>
                </div>
            </div>
        </header>
        
        <!-- 主游戏区 -->
        <main class="game-area">
            <!-- 地图视图 -->
            <section class="map-section" id="mapSection">
                <h2 class="section-title">🗺️ 征战地图</h2>
                <div class="map-grid" id="mapGrid"></div>
            </section>
            
            <!-- 战斗视图 -->
            <section class="battle-view" id="battleView">
                <div class="battle-panels">
                    <div class="battle-panel">
                        <div class="battle-avatar" id="enemyAvatar">🏰</div>
                        <h3 class="battle-name" id="enemyName">黑暗城堡</h3>
                        <div class="battle-stats">
                            <div class="battle-stat">
                                <div class="battle-stat-label">攻击力</div>
                                <div class="battle-stat-value" id="enemyAttack">150</div>
                            </div>
                            <div class="battle-stat">
                                <div class="battle-stat-label">防御力</div>
                                <div class="battle-stat-value" id="enemyDefense">100</div>
                            </div>
                        </div>
                    </div>
                    <div class="battle-panel">
                        <div class="battle-avatar">👑</div>
                        <h3 class="battle-name">皇家军团</h3>
                        <div class="battle-stats">
                            <div class="battle-stat">
                                <div class="battle-stat-label">总攻击</div>
                                <div class="battle-stat-value player" id="totalAttack">0</div>
                            </div>
                            <div class="battle-stat">
                                <div class="battle-stat-label">总防御</div>
                                <div class="battle-stat-value player" id="totalDefense">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 招募区域 -->
                <div class="action-dock">
                    <h3 style="text-align: center; color: var(--neon-green); margin-bottom: var(--space-md);">⚔️ 兵种招募</h3>
                    <div class="units-carousel" id="unitsCarousel"></div>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="backToMap()">← 返回地图</button>
                        <button class="btn btn-primary" onclick="startBattle()">⚔️ 开始战斗</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- 解锁弹窗 -->
    <div class="modal-backdrop" id="unlockModal">
        <div class="modal-panel">
            <h2 class="modal-title">🔓 解锁新兵种</h2>
            <div class="unlock-grid" id="unlockGrid"></div>
            <button class="btn btn-primary" onclick="closeUnlockModal()" style="width: 100%;">关闭</button>
        </div>
    </div>
    
    <!-- 战斗结果弹窗 -->
    <div class="modal-backdrop" id="resultModal">
        <div class="modal-panel">
            <div class="battle-result">
                <div class="result-icon" id="resultIcon">🏆</div>
                <h2 class="result-title" id="resultTitle">胜利！</h2>
                <p id="resultMessage" style="color: var(--text-muted); margin-bottom: var(--space-lg);">敌军已被征服</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); margin-bottom: var(--space-lg);">
                    <div class="battle-stat">
                        <div class="battle-stat-label">造成伤害</div>
                        <div class="battle-stat-value" id="damageDealt">0</div>
                    </div>
                    <div class="battle-stat">
                        <div class="battle-stat-label">获得金币</div>
                        <div class="battle-stat-value" style="color: var(--neon-yellow);" id="goldEarned">0</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="closeResultModal()" style="width: 100%;">继续征战</button>
            </div>
        </div>
    </div>
    
    <script>
        // ========== 游戏数据 ==========
        const gameData = {
            gold: 1000,
            victoryCount: 0,
            difficultyScale: 1.0,
            currentTarget: null,
            recruitedUnits: [],
            targets: [
                { id: 1, name: '边境哨站', emoji: '🏚️', difficulty: 'easy', attack: 50, defense: 30, reward: 200 },
                { id: 2, name: '强盗营地', emoji: '⛺', difficulty: 'easy', attack: 80, defense: 50, reward: 350 },
                { id: 3, name: '废弃城堡', emoji: '🏰', difficulty: 'medium', attack: 120, defense: 80, reward: 500 },
                { id: 4, name: '兽人部落', emoji: '🏕️', difficulty: 'medium', attack: 150, defense: 100, reward: 700 },
                { id: 5, name: '黑暗要塞', emoji: '🗿', difficulty: 'hard', attack: 200, defense: 150, reward: 1000 },
                { id: 6, name: '龙之巢穴', emoji: '🐉', difficulty: 'hard', attack: 300, defense: 200, reward: 1500 },
                { id: 7, name: '恶魔王座', emoji: '👹', difficulty: 'hard', attack: 400, defense: 300, reward: 2000 },
                { id: 8, name: '虚空神殿', emoji: '🔮', difficulty: 'hard', attack: 500, defense: 400, reward: 3000 }
            ],
            units: [
                { id: 'infantry', name: '步兵', emoji: '⚔️', unlocked: true, unlockCost: 0, baseCost: 50, baseAttack: 20, baseHp: 100 },
                { id: 'archer', name: '弓箭手', emoji: '🏹', unlocked: false, unlockCost: 200, baseCost: 80, baseAttack: 35, baseHp: 60 },
                { id: 'pikeman', name: '长矛兵', emoji: '🔱', unlocked: false, unlockCost: 300, baseCost: 100, baseAttack: 25, baseHp: 120 },
                { id: 'shieldman', name: '盾兵', emoji: '🛡️', unlocked: false, unlockCost: 400, baseCost: 120, baseAttack: 15, baseHp: 150 },
                { id: 'cavalry', name: '骑兵', emoji: '🐴', unlocked: false, unlockCost: 500, baseCost: 150, baseAttack: 45, baseHp: 90 },
                { id: 'tank', name: '坦克', emoji: '⚙️', unlocked: false, unlockCost: 600, baseCost: 200, baseAttack: 60, baseHp: 200 }
            ],
            unitLevels: {}
        };
        
        // ========== 初始化 ==========
        function initGame() {
            initUnitLevels();
            renderMap();
            updateUI();
        }
        
        window.addEventListener('DOMContentLoaded', initGame);
        
        function initUnitLevels() {
            gameData.units.forEach(unit => {
                if (!gameData.unitLevels[unit.id]) {
                    gameData.unitLevels[unit.id] = { level: 1, upgradeCost: Math.floor(unit.baseCost * 0.8) };
                }
            });
        }
        
        function updateUI() {
            document.getElementById('goldAmount').textContent = gameData.gold;
            document.getElementById('victoryCount').textContent = gameData.victoryCount;
        }
        
        // ========== 地图系统 ==========
        function renderMap() {
            document.getElementById('mapGrid').innerHTML = gameData.targets.map(t => {
                const stars = t.difficulty === 'easy' ? 1 : t.difficulty === 'medium' ? 3 : 5;
                return `
                    <div class="target-card" onclick="selectTarget(${t.id})">
                        <div class="target-emoji">${t.emoji}</div>
                        <div class="target-name">${t.name}</div>
                        <div class="target-difficulty">${'⭐'.repeat(stars)}</div>
                        <div class="target-reward">💰 ${t.reward}</div>
                    </div>
                `;
            }).join('');
        }
        
        function selectTarget(targetId) {
            gameData.currentTarget = gameData.targets.find(t => t.id === targetId);
            gameData.recruitedUnits = [];
            
            // 应用难度倍率
            const scaledAttack = Math.floor(gameData.currentTarget.attack * gameData.difficultyScale);
            const scaledDefense = Math.floor(gameData.currentTarget.defense * gameData.difficultyScale);
            
            document.getElementById('enemyAvatar').textContent = gameData.currentTarget.emoji;
            document.getElementById('enemyName').textContent = gameData.currentTarget.name;
            document.getElementById('enemyAttack').textContent = scaledAttack;
            document.getElementById('enemyDefense').textContent = scaledDefense;
            
            document.getElementById('mapSection').style.display = 'none';
            document.getElementById('battleView').classList.add('active');
            
            renderUnitsCarousel();
            updatePlayerStats();
        }
        
        function backToMap() {
            document.getElementById('mapSection').style.display = 'block';
            document.getElementById('battleView').classList.remove('active');
            gameData.currentTarget = null;
            gameData.recruitedUnits = [];
        }
        
        // ========== 兵种系统 ==========
        function getUnitStats(unitId) {
            const unit = gameData.units.find(u => u.id === unitId);
            const levelData = gameData.unitLevels[unitId];
            const multiplier = 1 + (levelData.level - 1) * 0.2;
            return { 
                attack: Math.floor(unit.baseAttack * multiplier), 
                hp: Math.floor(unit.baseHp * multiplier), 
                cost: unit.baseCost 
            };
        }
        
        function renderUnitsCarousel() {
            document.getElementById('unitsCarousel').innerHTML = gameData.units.filter(u => u.unlocked).map(unit => {
                const stats = getUnitStats(unit.id);
                return `
                    <div class="unit-mini-card">
                        <div class="unit-mini-header">
                            <span class="unit-mini-icon">${unit.emoji}</span>
                            <span class="unit-mini-name">${unit.name}</span>
                        </div>
                        <div class="unit-mini-stats">
                            <span>⚔️${stats.attack}</span>
                            <span>❤️${stats.hp}</span>
                            <span>💰${stats.cost}</span>
                        </div>
                        <button class="btn btn-primary" onclick="recruitUnit('${unit.id}')" style="padding: 4px 8px; font-size: 11px;">招募</button>
                    </div>
                `;
            }).join('');
        }
        
        function recruitUnit(unitId) {
            const unit = gameData.units.find(u => u.id === unitId);
            const stats = getUnitStats(unitId);
            if (gameData.gold >= stats.cost) {
                gameData.gold -= stats.cost;
                gameData.recruitedUnits.push({ 
                    id: unitId, 
                    name: unit.name, 
                    emoji: unit.emoji, 
                    attack: stats.attack, 
                    hp: stats.hp 
                });
                updateUI();
                renderUnitsCarousel();
                updatePlayerStats();
            }
        }
        
        function updatePlayerStats() {
            const totalAttack = gameData.recruitedUnits.reduce((sum, u) => sum + u.attack, 0);
            const totalDefense = gameData.recruitedUnits.reduce((sum, u) => sum + u.hp, 0);
            document.getElementById('totalAttack').textContent = totalAttack;
            document.getElementById('totalDefense').textContent = totalDefense;
        }
        
        // ========== 解锁系统 ==========
        function showUnlockModal() {
            document.getElementById('unlockGrid').innerHTML = gameData.units.map(unit => {
                const canUnlock = !unit.unlocked && gameData.gold >= unit.unlockCost;
                return `
                    <div class="unlock-card ${unit.unlocked ? '' : canUnlock ? 'can-unlock' : ''}">
                        <div style="font-size: 40px; margin-bottom: 8px;">${unit.emoji}${!unit.unlocked ? '🔒' : ''}</div>
                        <div style="font-weight: bold; margin-bottom: 4px;">${unit.name}</div>
                        <div style="color: var(--neon-yellow); font-size: 12px; margin-bottom: 8px;">
                            ${unit.unlocked ? '✅ 已解锁' : '💰 ' + unit.unlockCost}
                        </div>
                        ${!unit.unlocked ? `
                            <button class="btn ${canUnlock ? 'btn-primary' : 'btn-secondary'}" 
                                onclick="unlockUnit('${unit.id}')" 
                                ${!canUnlock ? 'disabled' : ''}
                                style="padding: 4px 8px; font-size: 11px;">
                                ${canUnlock ? '解锁' : '金币不足'}
                            </button>
                        ` : '<button class="btn btn-secondary" disabled style="padding: 4px 8px; font-size: 11px;">已拥有</button>'}
                    </div>
                `;
            }).join('');
            document.getElementById('unlockModal').classList.add('active');
        }
        
        function closeUnlockModal() {
            document.getElementById('unlockModal').classList.remove('active');
        }
        
        function unlockUnit(unitId) {
            const unit = gameData.units.find(u => u.id === unitId);
            if (!unit.unlocked && gameData.gold >= unit.unlockCost) {
                gameData.gold -= unit.unlockCost;
                unit.unlocked = true;
                updateUI();
                showUnlockModal();
            }
        }
        
        // ========== 战斗系统 ==========
        function startBattle() {
            if (gameData.recruitedUnits.length === 0) { 
                alert('请先招募兵种！'); 
                return; 
            }
            
            const totalAttack = gameData.recruitedUnits.reduce((sum, u) => sum + u.attack, 0);
            const totalDefense = gameData.recruitedUnits.reduce((sum, u) => sum + u.hp, 0);
            const enemyAttack = Math.floor(gameData.currentTarget.attack * gameData.difficultyScale);
            const enemyDefense = Math.floor(gameData.currentTarget.defense * gameData.difficultyScale);
            
            let playerHp = totalDefense;
            let enemyHp = enemyDefense;
            let damageDealt = 0;
            
            // 简化战斗计算
            while (playerHp > 0 && enemyHp > 0) {
                enemyHp -= totalAttack;
                damageDealt += totalAttack;
                if (enemyHp <= 0) break;
                playerHp -= enemyAttack;
            }
            
            const isVictory = playerHp > 0;
            
            if (isVictory) {
                gameData.gold += gameData.currentTarget.reward;
                gameData.victoryCount++;
                // 难度成长
                gameData.difficultyScale = 1 + (gameData.victoryCount * 0.12) + (gameData.victoryCount * gameData.victoryCount * 0.005);
            }
            
            showResult(isVictory, damageDealt, gameData.currentTarget.reward);
            updateUI();
        }
        
        function showResult(isVictory, damage, reward) {
            document.getElementById('resultIcon').textContent = isVictory ? '🏆' : '💀';
            document.getElementById('resultTitle').textContent = isVictory ? '胜利！' : '失败！';
            document.getElementById('resultTitle').className = 'result-title ' + (isVictory ? 'victory' : 'defeat');
            document.getElementById('resultMessage').textContent = isVictory ? '敌军已被征服' : '军团需要更强大的力量';
            document.getElementById('damageDealt').textContent = damage;
            document.getElementById('goldEarned').textContent = isVictory ? '+' + reward : '0';
            document.getElementById('resultModal').classList.add('active');
        }
        
        function closeResultModal() {
            document.getElementById('resultModal').classList.remove('active');
            backToMap();
        }
    </script>
</body>
</html>
