<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人军团战斗</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        h1 {
            color: #e94560;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 2.5em;
        }
        #gameCanvas {
            border: 3px solid #e94560;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 50%, #228B22 100%);
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }
        .controls {
            margin: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-infantry { background: #4CAF50; color: white; }
        .btn-archer { background: #FF9800; color: white; }
        .btn-shield { background: #2196F3; color: white; }
        .btn-spear { background: #9C27B0; color: white; }
        .btn-tank { background: #f44336; color: white; }
        .btn-battle { background: #e94560; color: white; font-size: 20px; padding: 15px 40px; }
        .btn-clear { background: #607D8B; color: white; }
        button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .info { color: #fff; margin: 10px; font-size: 14px; text-align: center; }
        .stats { display: flex; gap: 30px; color: #fff; margin: 10px; font-size: 18px; }
        .team-a { color: #4CAF50; }
        .team-b { color: #f44336; }
    </style>
</head>
<body>
    <h1>⚔️ 火柴人军团战斗 ⚔️</h1>
    <div class="stats">
        <div class="team-a">🟢 A队: <span id="teamACount">0</span></div>
        <div class="team-b">🔴 B队: <span id="teamBCount">0</span></div>
    </div>
    <canvas id="gameCanvas" width="1200" height="600"></canvas>
    <div class="controls">
        <button class="btn-infantry" onclick="addUnit('infantry', 'A')">+ 步兵 (A队)</button>
        <button class="btn-archer" onclick="addUnit('archer', 'A')">+ 工兵 (A队)</button>
        <button class="btn-shield" onclick="addUnit('shield', 'A')">+ 盾兵 (A队)</button>
        <button class="btn-spear" onclick="addUnit('spear', 'A')">+ 矛兵 (A队)</button>
        <button class="btn-tank" onclick="addUnit('tank', 'A')">+ 坦克 (A队)</button>
    </div>
    <div class="controls">
        <button class="btn-infantry" onclick="addUnit('infantry', 'B')">+ 步兵 (B队)</button>
        <button class="btn-archer" onclick="addUnit('archer', 'B')">+ 工兵 (B队)</button>
        <button class="btn-shield" onclick="addUnit('shield', 'B')">+ 盾兵 (B队)</button>
        <button class="btn-spear" onclick="addUnit('spear', 'B')">+ 矛兵 (B队)</button>
        <button class="btn-tank" onclick="addUnit('tank', 'B')">+ 坦克 (B队)</button>
    </div>
    <div class="controls">
        <button class="btn-battle" onclick="startBattle()">🔥 开始战斗!</button>
        <button class="btn-clear" onclick="clearField()">清空战场</button>
    </div>
    <div class="info">
        点击按钮添加单位，然后点击"开始战斗"观看火柴人大战！<br>
        步兵-刀斩 | 工兵-射箭 | 盾兵-防御 | 矛兵-冲刺 | 坦克-开炮
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let units = [], projectiles = [], damageNumbers = [], explosions = [];
        let battleStarted = false, animationId = null;

        const unitTypes = {
            infantry: { name: '步兵', hp: 100, attack: 20, range: 60, speed: 1.5, color: '#333', attackCooldown: 60, attackType: 'melee' },
            archer: { name: '工兵', hp: 60, attack: 25, range: 250, speed: 1, color: '#8B4513', attackCooldown: 90, attackType: 'ranged' },
            shield: { name: '盾兵', hp: 150, attack: 10, range: 50, speed: 0.8, color: '#4682B4', attackCooldown: 80, attackType: 'melee', defense: 0.5 },
            spear: { name: '矛兵', hp: 80, attack: 35, range: 100, speed: 1.2, color: '#800080', attackCooldown: 70, attackType: 'charge' },
            tank: { name: '坦克', hp: 300, attack: 50, range: 200, speed: 0.5, color: '#556B2F', attackCooldown: 120, attackType: 'cannon' }
        };

        class Unit {
            constructor(type, team, x, y) {
                this.type = type; this.team = team; this.x = x; this.y = y;
                this.config = unitTypes[type];
                this.maxHp = this.config.hp; this.hp = this.maxHp;
                this.attackCooldown = 0; this.isAttacking = false; this.attackFrame = 0;
                this.direction = team === 'A' ? 1 : -1;
                this.isDead = false; this.charging = false; this.chargeSpeed = 0;
            }
            update() {
                if (this.isDead) return;
                if (this.attackCooldown > 0) this.attackCooldown--;
                const target = this.findNearestEnemy();
                if (!target) return;
                const dist = Math.abs(target.x - this.x);
                if (this.isAttacking) {
                    this.attackFrame++;
                    if (this.attackFrame >= 20) { this.isAttacking = false; this.attackFrame = 0; }
                    return;
                }
                if (this.charging) {
                    this.x += this.chargeSpeed * this.direction;
                    this.chargeSpeed *= 0.95;
                    if (this.chargeSpeed < 0.5) this.charging = false;
                    return;
                }
                if (dist > this.config.range) {
                    this.x += this.config.speed * this.direction;
                } else if (this.attackCooldown <= 0) {
                    this.attack(target);
                }
            }
            findNearestEnemy() {
                let nearest = null, minDist = Infinity;
                units.forEach(unit => {
                    if (unit.team !== this.team && !unit.isDead) {
                        const dist = Math.abs(unit.x - this.x);
                        if (dist < minDist) { minDist = dist; nearest = unit; }
                    }
                });
                return nearest;
            }
            attack(target) {
                this.isAttacking = true; this.attackFrame = 0; this.attackCooldown = this.config.attackCooldown;
                switch (this.config.attackType) {
                    case 'melee': this.meleeAttack(target); break;
                    case 'ranged': this.rangedAttack(target); break;
                    case 'charge': this.chargeAttack(target); break;
                    case 'cannon': this.cannonAttack(target); break;
                }
            }
            meleeAttack(target) {
                const damage = this.config.attack;
                target.takeDamage(damage, this.x < target.x ? 1 : -1);
                showDamage(target.x, target.y - 60, damage);
            }
            rangedAttack(target) {
                projectiles.push(new Projectile(this.x + 20 * this.direction, this.y - 30, target.x, target.y - 30, this.config.attack, 'arrow', this.team));
            }
            chargeAttack(target) {
                this.charging = true; this.chargeSpeed = 8;
                setTimeout(() => {
                    if (!target.isDead && Math.abs(target.x - this.x) < 120) {
                        target.takeDamage(this.config.attack, this.direction);
                        showDamage(target.x, target.y - 60, this.config.attack);
                    }
                }, 200);
            }
            cannonAttack(target) {
                projectiles.push(new Projectile(this.x + 40 * this.direction, this.y - 20, target.x, target.y - 20, this.config.attack, 'cannonball', this.team));
            }
            takeDamage(damage, knockbackDir) {
                let actualDamage = this.config.defense ? damage * (1 - this.config.defense) : damage;
                actualDamage = Math.floor(actualDamage);
                this.hp -= actualDamage; this.x += knockbackDir * 5;
                if (this.hp <= 0) { this.hp = 0; this.isDead = true; }
            }
            draw() {
                if (this.isDead) { this.drawDead(); return; }
                ctx.save();
                const teamColor = this.team === 'A' ? '#4CAF50' : '#f44336';
                this.drawStickman(teamColor);
                this.drawWeapon();
                this.drawHealthBar();
                ctx.restore();
            }
            drawStickman(teamColor) {
                const x = this.x, y = this.y, dir = this.direction;
                ctx.strokeStyle = teamColor; ctx.lineWidth = 3; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(x, y - 70, 12, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y - 58); ctx.lineTo(x, y - 25); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y - 25); ctx.lineTo(x - 10, y); ctx.moveTo(x, y - 25); ctx.lineTo(x + 10, y); ctx.stroke();
                let armAngle = 0;
                if (this.isAttacking) {
                    const progress = this.attackFrame / 20;
                    if (this.type === 'infantry') armAngle = Math.sin(progress * Math.PI) * Math.PI / 2;
                    else if (this.type === 'shield') armAngle = -Math.PI / 4;
                } else if (this.charging) armAngle = Math.PI / 3;
                ctx.beginPath(); ctx.moveTo(x, y - 45);
                const leftHandX = x - 15 * dir + Math.sin(armAngle) * 10;
                const leftHandY = y - 35 + Math.cos(armAngle) * 10;
                ctx.lineTo(leftHandX, leftHandY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y - 45);
                const rightHandX = x + 15 * dir - Math.sin(armAngle) * 10;
                const rightHandY = y - 35 + Math.cos(armAngle) * 10;
                ctx.lineTo(rightHandX, rightHandY); ctx.stroke();
                this.leftHand = { x: leftHandX, y: leftHandY };
                this.rightHand = { x: rightHandX, y: rightHandY };
            }
            drawWeapon() {
                const x = this.x, y = this.y, dir = this.direction;
                ctx.strokeStyle = this.config.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
                let weaponAngle = 0;
                if (this.isAttacking) {
                    const progress = this.attackFrame / 20;
                    if (this.type === 'infantry') weaponAngle = -Math.PI / 2 + progress * Math.PI;
                    else if (this.type === 'spear') weaponAngle = progress < 0.5 ? -Math.PI / 6 : Math.PI / 6;
                } else if (this.charging) weaponAngle = Math.PI / 6;
                switch (this.type) {
                    case 'infantry': this.drawSword(x + 20 * dir, y - 35, dir, weaponAngle); break;
                    case 'archer': this.drawBow(x - 15 * dir, y - 35, dir); break;
                    case 'shield': this.drawShield(x + 15 * dir, y - 30, dir); break;
                    case 'spear': this.drawSpear(x + 25 * dir, y - 30, dir, weaponAngle); break;
                }
            }
            drawSword(handX, handY, dir, angle) {
                const swordLength = 40;
                const endX = handX + Math.cos(angle) * swordLength * dir;
                const endY = handY + Math.sin(angle) * swordLength;
                ctx.strokeStyle = '#C0C0C0'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(endX, endY); ctx.stroke();
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(handX - 5 * dir, handY); ctx.lineTo(handX + 5 * dir, handY); ctx.stroke();
                if (this.isAttacking && this.attackFrame < 10) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(endX, endY); ctx.stroke();
                }
            }
            drawBow(handX, handY, dir) {
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(handX, handY, 20, -Math.PI/2, Math.PI/2, dir===1); ctx.stroke();
                ctx.strokeStyle = '#DDD'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(handX, handY-20); ctx.lineTo(handX-15*dir, handY); ctx.lineTo(handX, handY+20); ctx.stroke();
            }
            drawShield(shandX, handY, dir) {
                ctx.fillStyle = '#4682B4'; ctx.strokeStyle = '#2F4F4F'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.ellipse(shandX, handY, 15, 25, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(shandX-8, handY); ctx.lineTo(shandX+8, handY); ctx.moveTo(shandX, handY-15); ctx.lineTo(shandX, handY+15); ctx.stroke();
                if (this.isAttacking) {
                    ctx.strokeStyle = 'rgba(70,130,180,0.5)'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.ellipse(shandX, handY, 18, 28, 0, 0, Math.PI*2); ctx.stroke();
                }
            }
            drawSpear(handX, handY, dir, angle) {
                const spearLength = 70;
                const endX = handX + Math.cos(angle) * spearLength * dir;
                const endY = handY + Math.sin(angle) * spearLength;
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(handX-30*dir, handY+10); ctx.lineTo(endX, endY); ctx.stroke();
                ctx.fillStyle = '#C0C0C0';
                ctx.beginPath(); ctx.moveTo(endX, endY); ctx.lineTo(endX-8*dir, endY-5); ctx.lineTo(endX-8*dir, endY+5); ctx.closePath(); ctx.fill();
                if (this.charging) {
                    ctx.strokeStyle = 'rgba(128,0,128,0.3)'; ctx.lineWidth = 2;
                    for (let i = 1; i <= 3; i++) {
                        ctx.beginPath(); ctx.moveTo(handX-30*dir-i*10*dir, handY+10); ctx.lineTo(endX-i*10*dir, endY); ctx.stroke();
                    }
                }
            }
            drawHealthBar() {
                const barWidth = 40, barHeight = 6;
                const x = this.x - barWidth/2, y = this.y - 95;
                ctx.fillStyle = '#333'; ctx.fillRect(x, y, barWidth, barHeight);
                const hpPercent = this.hp / this.maxHp;
                ctx.fillStyle = hpPercent > 0.5 ? '#4CAF50' : hpPercent > 0.25 ? '#FF9800' : '#f44336';
                ctx.fillRect(x, y, barWidth * hpPercent, barHeight);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(x, y, barWidth, barHeight);
            }
            drawDead() {
                const x = this.x, y = this.y;
                ctx.strokeStyle = '#666'; ctx.lineWidth = 3; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(x-10, y-10, 10, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x-5, y-5); ctx.lineTo(x+15, y+5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x+5, y-5); ctx.lineTo(x+15, y-15); ctx.moveTo(x+5, y-5); ctx.lineTo(x+15, y+5); ctx.stroke();
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x-15, y-15); ctx.lineTo(x-10, y-10); ctx.moveTo(x-10, y-15); ctx.lineTo(x-15, y-10); ctx.stroke();
            }
        }

        class Tank {
            constructor(team, x, y) {
                this.type = 'tank'; this.team = team; this.x = x; this.y = y;
                this.config = unitTypes.tank; this.maxHp = this.config.hp; this.hp = this.maxHp;
                this.attackCooldown = 0; this.isAttacking = false; this.attackFrame = 0;
                this.direction = team === 'A' ? 1 : -1; this.isDead = false;
            }
            update() {
                if (this.isDead) return;
                if (this.attackCooldown > 0) this.attackCooldown--;
                const target = this.findNearestEnemy();
                if (!target) return;
                const dist = Math.abs(target.x - this.x);
                if (this.isAttacking) {
                    this.attackFrame++;
                    if (this.attackFrame >= 30) { this.isAttacking = false; this.attackFrame = 0; }
                    return;
                }
                if (dist > this.config.range) this.x += this.config.speed * this.direction;
                else if (this.attackCooldown <= 0) this.attack(target);
            }
            findNearestEnemy() {
                let nearest = null, minDist = Infinity;
                units.forEach(unit => { if (unit.team !== this.team && !unit.isDead) { const d = Math.abs(unit.x - this.x); if (d < minDist) { minDist = d; nearest = unit; } } });
                return nearest;
            }
            attack(target) {
                this.isAttacking = true; this.attackFrame = 0; this.attackCooldown = this.config.attackCooldown;
                projectiles.push(new Projectile(this.x + 50 * this.direction, this.y - 30, target.x, target.y - 20, this.config.attack, 'cannonball', this.team));
            }
            takeDamage(damage) { this.hp -= damage; if (this.hp <= 0) { this.hp = 0; this.isDead = true; } }
            draw() {
                if (this.isDead) { this.drawDead(); return; }
                ctx.save();
                const teamColor = this.team === 'A' ? '#4CAF50' : '#f44336', x = this.x, y = this.y, dir = this.direction;
                ctx.fillStyle = '#333'; ctx.fillRect(x-40, y-15, 80, 15); ctx.fillRect(x-40, y-50, 80, 15);
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
                for (let i = -35; i < 40; i += 10) { ctx.beginPath(); ctx.moveTo(x+i, y-15); ctx.lineTo(x+i, y); ctx.moveTo(x+i, y-50); ctx.lineTo(x+i, y-35); ctx.stroke(); }
                ctx.fillStyle = teamColor; ctx.fillRect(x-35, y-45, 70, 30);
                ctx.fillStyle = '#2E7D32'; ctx.fillRect(x-20, y-60, 40, 20);
                let barrelAngle = this.isAttacking ? Math.sin((this.attackFrame/30) * Math.PI * 2) * 0.1 : 0;
                ctx.save(); ctx.translate(x, y-50); ctx.rotate(barrelAngle); ctx.fillStyle = '#1B5E20'; ctx.fillRect(0, -5, 50*dir, 10); ctx.restore();
                if (this.isAttacking && this.attackFrame < 10) {
                    ctx.fillStyle = '#FF5722'; ctx.beginPath(); ctx.arc(x+50*dir, y-50, 15+Math.random()*10, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#FFEB3B'; ctx.beginPath(); ctx.arc(x+50*dir, y-50, 8+Math.random()*5, 0, Math.PI*2); ctx.fill();
                }
                const barWidth = 60, barHeight = 8, barX = x - barWidth/2, barY = y - 80;
                ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barWidth, barHeight);
                const hpPercent = this.hp / this.maxHp;
                ctx.fillStyle = hpPercent > 0.5 ? '#4CAF50' : hpPercent > 0.25 ? '#FF9800' : '#f44336';
                ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barWidth, barHeight);
                ctx.restore();
            }
            drawDead() {
                const x = this.x, y = this.y;
                ctx.fillStyle = '#555'; ctx.fillRect(x-40, y-30, 80, 30);
                ctx.fillStyle = '#333';
                for (let i = 0; i < 5; i++) { const ox = (Math.random()-0.5)*60, oy = (Math.random()-0.5)*40; ctx.beginPath(); ctx.arc(x+ox, y-20+oy, 5+Math.random()*10, 0, Math.PI*2); ctx.fill(); }
            }
        }

        class Projectile {
            constructor(x, y, targetX, targetY, damage, type, team) {
                this.x = x; this.y = y; this.damage = damage; this.type = type; this.team = team; this.active = true; this.trail = [];
                const dx = targetX - x, dy = targetY - y, dist = Math.sqrt(dx*dx + dy*dy);
                this.speed = type === 'cannonball' ? 8 : 12;
                this.vx = (dx/dist) * this.speed; this.vy = (dy/dist) * this.speed;
            }
            update() {
                this.trail.push({x: this.x, y: this.y}); if (this.trail.length > 10) this.trail.shift();
                this.x += this.vx; this.y += this.vy;
                units.forEach(unit => {
                    if (unit.team !== this.team && !unit.isDead && this.active) {
                        const dist = Math.sqrt(Math.pow(unit.x-this.x, 2) + Math.pow(unit.y-30-this.y, 2));
                        if (dist < 30) {
                            unit.takeDamage(this.damage, this.vx > 0 ? 1 : -1);
                            showDamage(unit.x, unit.y - 60, this.damage);
                            this.active = false;
                            if (this.type === 'cannonball') createExplosion(this.x, this.y);
                        }
                    }
                });
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.active = false;
            }
            draw() {
                ctx.save();
                if (this.type === 'arrow') {
                    ctx.strokeStyle = 'rgba(139,69,19,0.3)'; ctx.lineWidth = 2;
                    for (let i = 0; i < this.trail.length - 1; i++) {
                        ctx.beginPath(); ctx.moveTo(this.trail[i].x, this.trail[i].y); ctx.lineTo(this.trail[i+1].x, this.trail[i+1].y); ctx.stroke();
                    }
                    ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#333';
                    for (let i = 0; i < this.trail.length; i++) {
                        const alpha = i / this.trail.length;
                        ctx.globalAlpha = alpha * 0.5;
                        ctx.beginPath(); ctx.arc(this.trail[i].x, this.trail[i].y, 4 + i*0.5, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        class DamageNumber {
            constructor(x, y, damage) {
                this.x = x; this.y = y; this.damage = damage; this.life = 30; this.vy = -2;
            }
            update() { this.y += this.vy; this.life--; }
            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(255, 0, 0, ${this.life/30})`;
                ctx.font = 'bold 24px Arial';
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeText('-' + this.damage, this.x, this.y);
                ctx.fillText('-' + this.damage, this.x, this.y);
                ctx.restore();
            }
        }

        class Explosion {
            constructor(x, y) {
                this.x = x; this.y = y; this.life = 20; this.particles = [];
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        size: 5 + Math.random() * 10,
                        color: ['#FF5722', '#FFEB3B', '#FF9800'][Math.floor(Math.random() * 3)]
                    });
                }
            }
            update() {
                this.life--;
                this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.size *= 0.95; });
            }
            draw() {
                ctx.save();
                this.particles.forEach(p => {
                    ctx.globalAlpha = this.life / 20;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                });
                ctx.restore();
            }
        }

        function showDamage(x, y, damage) { damageNumbers.push(new DamageNumber(x, y, damage)); }
        function createExplosion(x, y) { explosions.push(new Explosion(x, y)); }

        function addUnit(type, team) {
            const y = 400 + Math.random() * 100;
            const x = team === 'A' ? 100 + Math.random() * 200 : 900 + Math.random() * 200;
            if (type === 'tank') units.push(new Tank(team, x, y));
            else units.push(new Unit(type, team, x, y));
            updateStats();
        }

        function updateStats() {
            document.getElementById('teamACount').textContent = units.filter(u => u.team === 'A' && !u.isDead).length;
            document.getElementById('teamBCount').textContent = units.filter(u => u.team === 'B' && !u.isDead).length;
        }

        function startBattle() { battleStarted = true; }
        function clearField() { units = []; projectiles = []; damageNumbers = []; explosions = []; battleStarted = false; updateStats(); }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#228B22'; ctx.fillRect(0, 500, canvas.width, 100);
            ctx.fillStyle = '#90EE90'; ctx.fillRect(0, 480, canvas.width, 20);
            
            if (battleStarted) {
                units.forEach(unit => unit.update());
                projectiles.forEach(p => p.update());
                damageNumbers.forEach(d => d.update());
                explosions.forEach(e => e.update());
                projectiles = projectiles.filter(p => p.active);
                damageNumbers = damageNumbers.filter(d => d.life > 0);
                explosions = explosions.filter(e => e.life > 0);
                updateStats();
            }
            
            units.forEach(unit => unit.draw());
            projectiles.forEach(p => p.draw());
            explosions.forEach(e => e.draw());
            damageNumbers.forEach(d => d.draw());
            
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
